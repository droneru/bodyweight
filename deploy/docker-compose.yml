# Production: the web app. Used by `make deploy` on the VPS.
# HTTPS and routing by domain are done by a shared reverse proxy on the VPS,
# which reaches the app as bodyweight-app:3000 over the external "proxy" network.
name: bodyweight

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bodyweight:latest
    restart: unless-stopped
    # YDB location and credentials, and the Yandex OAuth application: see deploy/.env.example.
    env_file: .env
    environment:
      BODYWEIGHT_PUBLIC_URL: https://bodyweight.ru
    volumes:
      # Holds sa-key.json, the authorized key of the sa, when the app connects to Serverless YDB.
      # The app runs as uid 65532 and must be able to read it.
      - ./secrets:/run/secrets:ro
    expose:
      - "3000"
    networks:
      proxy:
        aliases:
          - bodyweight-app

networks:
  proxy:
    external: true
