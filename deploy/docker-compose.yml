# Production: caddy (HTTPS with automatic certificates, reverse proxy) and the web app.
# Used by `make deploy` on the VPS.
name: bodyweight

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bodyweight:latest
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account; must survive container rebuilds.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
